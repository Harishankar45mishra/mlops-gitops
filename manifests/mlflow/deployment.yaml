apiVersion: apps/v1
kind: Deployment

metadata:
  name: mlflow
  namespace: mlflow

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mlflow

  template:
    metadata:
      labels:
        app: mlflow

    spec:
      serviceAccountName: mlflow-sa

      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: mlflow-secrets

      containers:
        - name: mlflow
          image: mlflow
          imagePullPolicy: Always

          ports:
            - containerPort: 5000

          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mlflow-secret
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mlflow-secret
                  key: DB_PASSWORD

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mlflow-secret
                  key: DB_NAME

            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: mlflow-config
                  key: DB_HOST

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: mlflow-config
                  key: DB_PORT

            - name: ARTIFACT_ROOT
              valueFrom:
                configMapKeyRef:
                  name: mlflow-config
                  key: ARTIFACT_ROOT

          command:
            - /bin/sh
            - -c

          args:
            - |
              export BACKEND_STORE_URI="postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}"

              exec mlflow server \
                --host 0.0.0.0 \
                --port 5000 \
                --backend-store-uri "${BACKEND_STORE_URI}" \
                --default-artifact-root "${ARTIFACT_ROOT}"

          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
